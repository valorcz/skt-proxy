<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkT Proxy</title>

<style>
        :root {
            --bg-color: #050505;
            --surface-rgb: 15, 15, 15;
            --surface-hover: rgba(25, 25, 25, 0.8);
            --primary-invert: #ffffff;
            --text-main: #ededed;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);
            --seed-color: #10b981;
            --leech-color: #ef4444;
            --new-bg: rgba(255, 255, 255, 0.1);
            --new-text: #ffffff;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Modern Accents */
            --brand-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            --mesh-bg: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
        }

        [data-theme="light"] {
            --bg-color: #fafafa;
            --surface-rgb: 255, 255, 255;
            --surface-hover: rgba(255, 255, 255, 0.9);
            --primary-invert: #ffffff;
            --text-main: #171717;
            --text-muted: #71717a;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.15);
            --new-bg: rgba(0, 0, 0, 0.05);
            --new-text: #000000;
            
            --mesh-bg: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--mesh-bg);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color var(--transition), color var(--transition);
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 1rem;
        }

        h1 { margin: 0; font-weight: 700; font-size: 1.75rem; letter-spacing: -0.03em; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .controls { display: flex; gap: 0.75rem; align-items: center; }

        input[type="text"], .theme-toggle {
            padding: 0.5rem 0.75rem; font-size: 0.875rem; border-radius: 8px;
            border: 1px solid var(--border-color); background: rgba(var(--surface-rgb), 0.5);
            backdrop-filter: blur(8px); color: var(--text-main); outline: none; transition: var(--transition);
        }

        input[type="text"]:focus, .theme-toggle:hover { border-color: var(--border-hover); box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
        input[type="text"] { width: 220px; }
        .theme-toggle { cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .filters-container { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
        .filter-label { font-size: 0.85rem; color: var(--text-muted); margin-right: 0.5rem; font-weight: 500; }

        .pill {
            background: rgba(var(--surface-rgb), 0.5); backdrop-filter: blur(8px);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 0.4rem 0.8rem; border-radius: 9999px; cursor: pointer;
            font-size: 0.85rem; transition: var(--transition); user-select: none;
        }

        .pill:hover { border-color: var(--border-hover); transform: translateY(-1px); }
        .pill.active { background: var(--brand-gradient); color: var(--primary-invert); border: none; font-weight: 500; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2); }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; background: rgba(var(--surface-rgb), 0.9);
            backdrop-filter: blur(16px); min-width: 220px; max-height: 350px; overflow-y: auto;
            border: 1px solid var(--border-color); border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); z-index: 10;
            padding: 0.8rem; top: 110%; left: 0; flex-direction: column; gap: 0.5rem;
        }
        .dropdown-content.show { display: flex; }
        .dropdown-label { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; cursor: pointer; color: var(--text-main); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }

        .card {
            background-color: rgba(var(--surface-rgb), 0.4); backdrop-filter: blur(12px);
            border-radius: var(--radius); border: 1px solid var(--border-color);
            overflow: hidden; display: flex; flex-direction: column; transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .card:hover { border-color: rgba(139, 92, 246, 0.4); background-color: var(--surface-hover); transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        
        .card-img { width: 100%; height: 340px; object-fit: cover; background: transparent; border-bottom: 1px solid var(--border-color); transition: opacity var(--transition); }
        .card:hover .card-img { opacity: 0.9; }

        .card-content { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.75rem 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; letter-spacing: -0.01em; }

        .meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .badge { background: rgba(var(--surface-rgb), 0.5); border: 1px solid var(--border-color); padding: 0.1rem 0.5rem; border-radius: 6px; backdrop-filter: blur(4px); }
        .badge.new { background: var(--brand-gradient); color: var(--primary-invert); border: none; font-weight: 600; }

        .stats { display: flex; gap: 1rem; font-size: 0.8rem; margin-bottom: 1rem; margin-top: auto; padding-top: 1rem; font-weight: 500;}
        .seed { color: var(--seed-color); }
        .leech { color: var(--leech-color); }

        .btn {
            display: flex; align-items: center; justify-content: center; text-align: center;
            background: var(--brand-gradient); color: var(--primary-invert);
            text-decoration: none; padding: 0.6rem 0.75rem; border-radius: 8px;
            font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none;
            width: 100%; transition: var(--transition); box-sizing: border-box;
            background-size: 150% auto;
        }
        .btn:hover { background-position: right center; transform: scale(1.02); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25); }
        
        .btn-secondary { background: rgba(var(--surface-rgb), 0.5); color: var(--text-main); border: 1px solid var(--border-color); font-weight: 500; backdrop-filter: blur(4px); }
        .btn-secondary:hover { background: var(--surface-hover); border-color: rgba(139, 92, 246, 0.4); transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .action-stack { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
        .action-row { display: flex; gap: 0.5rem; }

        #loadMoreContainer { text-align: center; max-width: 200px; margin: 0 auto; }
        
        .skeleton { background: var(--border-color); height: 340px; width: 100%; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <header>
        <h1>SkT Proxy</h1>
        <div class="controls">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
            <input type="text" id="searchInput" placeholder="Search loaded..." onkeyup="filterLocalTorrents()">
        </div>
    </header>

    <div class="filters-container">
       <div class="filter-row" id="categoryRow">
            <span class="filter-label">Categories:</span>
       </div>

        <div class="filter-row">
            <span class="filter-label">Genres:</span>
            <div class="dropdown">
                <button class="pill" id="genreDropdownBtn" onclick="toggleGenreDropdown()">Select Genres ▾</button>
                <div class="dropdown-content" id="genreDropdownContent">
                    </div>
            </div>
            <div id="activeGenresContainer" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-left: 0.5rem;"></div>
        </div>
    </div>

    <main class="grid" id="torrentGrid">
        </main>

    <div id="loadMoreContainer">
        <button id="loadMoreBtn" class="btn btn-secondary" onclick="loadMore()">Load More</button>
    </div>

    <script>
        // --- Theme Management ---
        const htmlEl = document.documentElement;
        const savedTheme = localStorage.getItem('skt_theme');
        if (savedTheme) {
            htmlEl.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            htmlEl.setAttribute('data-theme', 'light');
        }

        function toggleTheme() {
            const newTheme = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', newTheme);
            localStorage.setItem('skt_theme', newTheme);
        }

        // --- State Management ---
        let selectedCategories = JSON.parse(localStorage.getItem('skt_cats')) || [];
        let selectedGenres = JSON.parse(localStorage.getItem('skt_genres')) || [];
        let currentPage = 0;

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchCategories();
            fetchGenres();
            fetchTorrents(true);
            
            // Close dropdown if clicked outside
            window.onclick = function(event) {
                if (!event.target.matches('#genreDropdownBtn') && !event.target.closest('#genreDropdownContent')) {
                    document.getElementById("genreDropdownContent").classList.remove('show');
                }
            }
        });

// --- Categories ---
        async function fetchCategories() {
            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();
                const container = document.getElementById('categoryRow');
                
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'pill';
                    btn.setAttribute('data-cat', cat.id);
                    btn.innerText = cat.name;
                    
                    if (selectedCategories.includes(cat.id)) {
                        btn.classList.add('active');
                    }
                    
                    btn.addEventListener('click', () => {
                        btn.classList.toggle('active');
                        if (btn.classList.contains('active')) {
                            if(!selectedCategories.includes(cat.id)) selectedCategories.push(cat.id);
                        } else {
                            selectedCategories = selectedCategories.filter(c => c !== cat.id);
                        }
                        localStorage.setItem('skt_cats', JSON.stringify(selectedCategories));
                        fetchTorrents(true);
                    });
                    
                    container.appendChild(btn);
                });
            } catch(e) { console.error("Failed to load categories", e); }
        }

        // --- Genres ---
        function toggleGenreDropdown() {
            document.getElementById("genreDropdownContent").classList.toggle("show");
        }

        async function fetchGenres() {
            try {
                const res = await fetch('/api/genres');
                const genres = await res.json();
                const container = document.getElementById('genreDropdownContent');
                
                genres.forEach(g => {
                    const isChecked = selectedGenres.includes(g) ? 'checked' : '';
                    const label = document.createElement('label');
                    label.className = 'dropdown-label';
                    label.innerHTML = `<input type="checkbox" value="${g}" ${isChecked} onchange="handleGenreChange(this)"> ${g}`;
                    container.appendChild(label);
                });
                renderActiveGenres();
            } catch(e) { console.error("Failed to load genres", e); }
        }

        function handleGenreChange(cb) {
            if (cb.checked) {
                if(!selectedGenres.includes(cb.value)) selectedGenres.push(cb.value);
            } else {
                selectedGenres = selectedGenres.filter(g => g !== cb.value);
            }
            localStorage.setItem('skt_genres', JSON.stringify(selectedGenres));
            renderActiveGenres();
            fetchTorrents(true);
        }

        function renderActiveGenres() {
            const container = document.getElementById('activeGenresContainer');
            container.innerHTML = '';
            selectedGenres.forEach(g => {
                const pill = document.createElement('span');
                pill.className = 'pill active';
                pill.innerHTML = `${g} ✕`;
                pill.onclick = () => {
                    document.querySelector(`input[value="${g}"]`).click();
                };
                container.appendChild(pill);
            });
            document.getElementById('genreDropdownBtn').innerText = selectedGenres.length > 0 ? `Genres (${selectedGenres.length}) ▾` : `Select Genres ▾`;
        }

        // --- Data Fetching ---
        function filterLocalTorrents() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.title').innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "" : "none";
            }
        }

        async function fetchTorrents(reset = false) {
            const grid = document.getElementById('torrentGrid');
            const btn = document.getElementById('loadMoreBtn');
            
            if (reset) {
                currentPage = 0;
                grid.innerHTML = '<div class="card"><div class="skeleton"></div></div><div class="card"><div class="skeleton"></div></div><div class="card"><div class="skeleton"></div></div>';
                btn.style.display = 'none';
            } else {
                currentPage++;
                btn.disabled = true;
                btn.innerText = "Loading...";
            }

            const catQuery = selectedCategories.join(',');
            const genreQuery = selectedGenres.join(',');
            
            try {
                const response = await fetch(`/api/torrents?page=${currentPage}&categories=${catQuery}&genres=${genreQuery}`);
                const data = await response.json();
                
                if (reset) grid.innerHTML = '';
                
                if (data.torrents.length === 0) {
                    if (reset) grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No results found for these filters.</p>';
                    btn.innerText = "No more items";
                    btn.style.display = reset ? 'none' : 'inline-block';
                    return;
                }

                data.torrents.forEach(t => {
                    const article = document.createElement('article');
                    article.className = 'card';
                    
                    let newBadge = t.is_new ? '<span class="badge new">New</span>' : '';
                    let genreBadge = t.genres ? t.genres.map(g => `<span class="badge">${g}</span>`).join('') : '';
                    let encodedTitle = t.download_link.split('&f=')[1];
                    let csfdBtn = t.csfd_id ? `<a href="https://www.csfd.cz/film/${t.csfd_id}" target="_blank" class="btn btn-secondary" style="flex: 0 0 auto; width: auto;" title="ČSFD">ČSFD</a>` : '';
                    let nasButton = data.can_use_nas ? `<button onclick="sendToNas('${t.id}', '${encodedTitle}', this)" class="btn btn-secondary">Send to NAS</button>` : '';
                    
                    article.innerHTML = `
                        <img class="card-img" src="${t.display_image}" loading="lazy" onerror="this.style.display='none'">
                        <div class="card-content">
                            <h2 class="title" title="${t.title}">${t.title}</h2>
                            <div class="meta">
                                ${newBadge}
                                <span class="badge">${t.category}</span>
                                ${genreBadge}
                                <span class="badge">${t.size}</span>
                                <span class="badge">${t.added_date}</span>
                            </div>
                            <div class="stats">
                                <span class="seed">▲ ${t.seeders}</span>
                                <span class="leech">▼ ${t.leechers}</span>
                            </div>
                            <div class="action-stack">
                                <div class="action-row">
                                    <a href="${t.download_link}" class="btn" style="flex: 1;">Download</a>
                                    ${csfdBtn}
                                </div>
                                ${nasButton}
                            </div>
                        </div>
                    `;
                    grid.appendChild(article);
                });

                filterLocalTorrents();
                btn.style.display = 'inline-block';
                btn.disabled = false;
                btn.innerText = "Load More";
                
            } catch (error) {
                btn.innerText = "Error loading";
                btn.disabled = false;
            }
        }

        function loadMore() { fetchTorrents(false); }

        async function sendToNas(id, f, btnElement) {
            const originalText = btnElement.innerText;
            btnElement.innerText = "Sending...";
            btnElement.disabled = true;

            try {
                const response = await fetch('/api/send_to_nas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, f: f })
                });
                const result = await response.json();

                if (result.success) {
                    btnElement.innerText = "Sent";
                    btnElement.style.borderColor = "var(--seed-color)";
                    btnElement.style.color = "var(--seed-color)";
                } else {
                    alert("Failed: " + result.error);
                    btnElement.innerText = "Error";
                }
            } catch (error) {
                alert("Network error: " + error);
                btnElement.innerText = originalText;
            }
            
            setTimeout(() => {
                if(btnElement.innerText === "Sent") {
                    btnElement.innerText = originalText;
                    btnElement.style.borderColor = "";
                    btnElement.style.color = "";
                    btnElement.disabled = false;
                }
            }, 3000);
        }
    </script>
</body>
</html>
