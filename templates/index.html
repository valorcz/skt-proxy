<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkT Proxy</title>
    <style>
        :root {
            /* Vercel/ChatGPT Dark Theme */
            --bg-color: #000000;
            --surface-color: #000000;
            --surface-hover: #0a0a0a;
            --primary-color: #ffffff;
            --primary-invert: #000000;
            --text-main: #ededed;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
            --border-hover: #3f3f46;
            --seed-color: #10b981;
            --leech-color: #ef4444;
            --new-bg: #3f3f46;
            --new-text: #ffffff;
            --radius: 8px;
            --transition: all 0.2s ease;
        }

        [data-theme="light"] {
            /* Vercel/ChatGPT Light Theme */
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --surface-hover: #fcfcfc;
            --primary-color: #000000;
            --primary-invert: #ffffff;
            --text-main: #171717;
            --text-muted: #71717a;
            --border-color: #e4e4e7;
            --border-hover: #d4d4d8;
            --new-bg: #e4e4e7;
            --new-text: #000000;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color var(--transition), color var(--transition);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            margin: 0;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        input[type="text"], select, .theme-toggle {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus, select:focus, .theme-toggle:hover {
            border-color: var(--border-hover);
        }

        input[type="text"] { width: 220px; }
        .theme-toggle { cursor: pointer; display: flex; align-items: center; justify-content: center;}

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .card:hover {
            border-color: var(--border-hover);
            background-color: var(--surface-hover);
            transform: translateY(-2px);
        }

        .card-img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            transition: opacity var(--transition);
        }

        .card:hover .card-img { opacity: 0.9; }

        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .title {
            font-size: 1rem;
            font-weight: 500;
            margin: 0 0 0.75rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .badge {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 0.1rem 0.5rem;
            border-radius: 9999px; /* Pill shape */
        }

        .badge.new {
            background: var(--new-bg);
            color: var(--new-text);
            border-color: var(--new-bg);
            font-weight: 500;
        }

        .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            margin-top: auto;
            padding-top: 1rem;
        }

        .seed { color: var(--seed-color); }
        .leech { color: var(--leech-color); }

        .btn {
            display: block;
            text-align: center;
            background-color: var(--primary-color);
            color: var(--primary-invert);
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--primary-color);
            width: 100%;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .btn:hover { opacity: 0.9; }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-hover);
        }
        
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        
        #loadMoreContainer { text-align: center; max-width: 200px; margin: 0 auto; }
    </style>
</head>
<body>

    <header>
        <h1>SkT Proxy</h1>
        <div class="controls">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
            <select id="categorySelect" onchange="changeCategory()">
                <option value="0" {% if current_category == '0' %}selected{% endif %}>All Categories</option>
                <option value="1" {% if current_category == '1' %}selected{% endif %}>Filmy CZ/SK</option>
                <option value="19" {% if current_category == '19' %}selected{% endif %}>HD Filmy</option>
                <option value="43" {% if current_category == '43' %}selected{% endif %}>UHD Filmy</option>
                <option value="16" {% if current_category == '16' %}selected{% endif %}>Seriály</option>
                <option value="44" {% if current_category == '44' %}selected{% endif %}>Sport</option>
                <option value="18" {% if current_category == '18' %}selected{% endif %}>Hry na Windows</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="filterTorrents()">
        </div>
    </header>

    <main class="grid" id="torrentGrid">
        {% for torrent in torrents %}
        <article class="card">
            <img class="card-img" src="{{ torrent.display_image }}" alt="Cover" loading="lazy" onerror="this.style.display='none'">
            <div class="card-content">
                <h2 class="title" title="{{ torrent.title }}">{{ torrent.title }}</h2>
                <div class="meta">
                    {% if torrent.is_new %}<span class="badge new">New</span>{% endif %}
                    <span class="badge">{{ torrent.category }}</span>
                    <span class="badge">{{ torrent.size }}</span>
                    <span class="badge">{{ torrent.added_date }}</span>
                </div>
                <div class="stats">
                    <span class="seed">▲ {{ torrent.seeders }}</span>
                    <span class="leech">▼ {{ torrent.leechers }}</span>
                </div>
                <a href="{{ torrent.download_link }}" class="btn">Download</a>
                {% if can_use_nas %}
                <button onclick="sendToNas('{{ torrent.id }}', '{{ torrent.download_link.split('&f=')[1] }}', this)" class="btn btn-secondary">Send to NAS</button>
                {% endif %}
            </div>
        </article>
        {% endfor %}
    </main>

    <div id="loadMoreContainer">
        <button id="loadMoreBtn" class="btn btn-secondary" onclick="loadMore()">Load More</button>
    </div>

    <script>
        const htmlEl = document.documentElement;
        const savedTheme = localStorage.getItem('skt_theme');
        if (savedTheme) {
            htmlEl.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            htmlEl.setAttribute('data-theme', 'light');
        }

        function toggleTheme() {
            const newTheme = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', newTheme);
            localStorage.setItem('skt_theme', newTheme);
        }

        let currentPage = 0;

        function changeCategory() {
            window.location.href = '/?category=' + document.getElementById('categorySelect').value;
        }

        function filterTorrents() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.title').innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "" : "none";
            }
        }

        async function loadMore() {
            const btn = document.getElementById('loadMoreBtn');
            const cat = document.getElementById('categorySelect').value;
            const grid = document.getElementById('torrentGrid');
            
            btn.disabled = true;
            btn.innerText = "Loading...";
            currentPage++;

            try {
                const response = await fetch(`/api/torrents?page=${currentPage}&category=${cat}`);
                const data = await response.json();
                
                if (data.torrents.length === 0) {
                    btn.innerText = "No more items";
                    return;
                }

                data.torrents.forEach(t => {
                    const article = document.createElement('article');
                    article.className = 'card';
                    let newBadge = t.is_new ? '<span class="badge new">New</span>' : '';
                    let encodedTitle = t.download_link.split('&f=')[1];
                    let nasButton = data.can_use_nas ? `<button onclick="sendToNas('${t.id}', '${encodedTitle}', this)" class="btn btn-secondary">Send to NAS</button>` : '';
                    
                    article.innerHTML = `
                        <img class="card-img" src="${t.display_image}" loading="lazy" onerror="this.style.display='none'">
                        <div class="card-content">
                            <h2 class="title" title="${t.title}">${t.title}</h2>
                            <div class="meta">
                                ${newBadge}
                                <span class="badge">${t.category}</span>
                                <span class="badge">${t.size}</span>
                                <span class="badge">${t.added_date}</span>
                            </div>
                            <div class="stats">
                                <span class="seed">▲ ${t.seeders}</span>
                                <span class="leech">▼ ${t.leechers}</span>
                            </div>
                            <a href="${t.download_link}" class="btn">Download</a>
                            ${nasButton}
                        </div>
                    `;
                    grid.appendChild(article);
                });

                filterTorrents();
                btn.disabled = false;
                btn.innerText = "Load More";
                
            } catch (error) {
                btn.innerText = "Error loading";
                btn.disabled = false;
            }
        }

        async function sendToNas(id, f, btnElement) {
            const originalText = btnElement.innerText;
            btnElement.innerText = "Sending...";
            btnElement.disabled = true;

            try {
                const response = await fetch('/api/send_to_nas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, f: f })
                });
                const result = await response.json();

                if (result.success) {
                    btnElement.innerText = "Sent";
                    btnElement.style.borderColor = "var(--seed-color)";
                    btnElement.style.color = "var(--seed-color)";
                } else {
                    alert("Failed: " + result.error);
                    btnElement.innerText = "Error";
                }
            } catch (error) {
                alert("Network error: " + error);
                btnElement.innerText = originalText;
            }
            
            setTimeout(() => {
                if(btnElement.innerText === "Sent") {
                    btnElement.innerText = originalText;
                    btnElement.style.borderColor = "";
                    btnElement.style.color = "";
                    btnElement.disabled = false;
                }
            }, 3000);
        }
    </script>
</body>
</html>
