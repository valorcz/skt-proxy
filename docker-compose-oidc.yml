services:
  skt-proxy:
    build: .
    container_name: skt-proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./seen_ids.txt:/app/seen_ids.txt
    expose:
      - "5000"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    restart: unless-stopped
    ports:
      - "4180:4180" 
    env_file:
      - .env
    environment:
      - OAUTH2_PROXY_UPSTREAMS=http://skt-proxy:5000
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_REVERSE_PROXY=true # Required if behind Nginx/Traefik
    depends_on:
      - skt-proxy

